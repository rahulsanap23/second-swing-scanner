name: weekly-history-test

# Replays the scanner on the last 5 years of NSE data and writes results/backtest.json + backtest.md.
# The daily run reads backtest.json to rank the picks, so this keeps the ranking up to date.
on:
  schedule:
    - cron: "37 3 * * 6"   # Saturday 9:07 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-swing-scan   # same group as the daily scan, so the two never push at the same time
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Get NSE data
        run: git clone --depth 1 --quiet https://github.com/BennyThadikaran/eod2_data.git /tmp/eod2_data

      - name: Run the history test
        run: python -u backtest.py /tmp/eod2_data --years 5

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest.json results/backtest.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "History test $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase --quiet
          git push

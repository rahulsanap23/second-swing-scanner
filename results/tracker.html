tr:last-child td { border-bottom: 0; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

, "regime": "GREEN", "suggested": ["2026-11-12"], "best_on": [], "close_at_pick": 1728.8, "entry": 1694.22, "stop": 1490.92, "t1": 1734.1, "sell_by": "2026-11-19", "status": "NOT TRIGGERED", "entry_date": null, "fill": null, "exit_date": null, "exit_price": null, "days": null, "last_close": null, "result_pct": null, "r_mult": null, "flag": "", "cmp": 1777.5, "cmp_date": "2026-11-23", "times_suggested": 1, "t1_pct": 2.4, "stop_pct": -12.0}, {"symbol": "KPRMILL", "company": "K.P.R. Mill Limited", "setup": "DIP", "regime": "GREEN", "suggested": ["2026-11-12"], "best_on": [], "close_at_pick": 1149.8, "entry": 1126.8, "stop": 991.59, "t1": 1143.28, "sell_by": "2026-11-19", "status": "NOT TRIGGERED", "entry_date": null, "fill": null, "exit_date": null, "exit_price": null, "days": null, "last_close": null, "result_pct": null, "r_mult": null, "flag": "", "cmp": 1206.9, "cmp_date": "2026-11-23", "times_suggested": 1, "t1_pct": 1.5, "stop_pct": -12.0}, {"symbol": "ALIVUS", "company": "Alivus Life Sciences Limited", "setup": "DIP", "regime": "GREEN", "suggested": ["2026-11-12"], "best_on": [], "close_at_pick": 1443.7, "entry": 1414.83, "stop": 1245.05, "t1": 1457.42, "sell_by": "2026-11-19", "status": "NOT TRIGGERED", "entry_date": null, "fill": null, "exit_date": null, "exit_price": null, "days": null, "last_close": null, "result_pct": null, "r_mult": null, "flag": "", "cmp": 1410.3, "cmp_date": "2026-11-23", "times_suggested": 1, "t1_pct": 3.0, "stop_pct": -12.0}]};
const ALL = DATA.trades || [], RULES = DATA.rules || {};
const MAXD = RULES.max_days || 5, SOLD = "SOLD DAY " + MAXD;
const CLOSED = ["TARGET HIT", "EXIT 10EMA", "STOP HIT", "BREAKEVEN", SOLD];
const WON = ["TARGET HIT", "EXIT 10EMA"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "–" : Number(n).toFixed(2);   // same style as the morning report (no commas)
const pct = n => n == null ? "" : (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
const day = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short"}) : "–";
const days = n => n + " day" + (n === 1 ? "" : "s");
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
let REP = {days: {}}, MODE = "report";
try { MODE = localStorage.getItem("tracker-mode") || "report"; } catch (e) {}

// In the morning report? Uses the list the morning task saved (reported.json); for days it has no list for,
// falls back to GitHub's own best picks of that day.
const inReport = t => (t.suggested || []).some(d =>
  Object.prototype.hasOwnProperty.call(REP.days || {}, d) ? (REP.days[d] || []).includes(t.symbol) : (t.best_on || []).includes(d));

function summary(T) {
  const done = T.filter(t => CLOSED.includes(t.status));
  const tgt = done.filter(t => WON.includes(t.status)), stp = done.filter(t => t.status === "STOP HIT");
  const one = g => ({picks: g.length, bought: g.filter(t => t.entry_date).length,
    closed: g.filter(t => CLOSED.includes(t.status)).length,
    win: (() => { const c = g.filter(t => CLOSED.includes(t.status)); return c.length ? Math.round(c.filter(t => (t.result_pct || 0) > 0).length / c.length * 100) : null; })(),
    avg: avg(g.filter(t => CLOSED.includes(t.status)).map(t => t.result_pct || 0))});
  const moods = {};
  for (const k of ["GREEN", "YELLOW", "RED"]) { const g = T.filter(t => t.regime === k); if (g.length) moods[k] = one(g); }
  const setups = {};
  for (const k of ["DIP", "PULLBACK", "BREAKOUT", "READY"]) { const g = T.filter(t => t.setup === k); if (g.length) setups[k] = one(g); }
  return {target: tgt.length, stop: stp.length, dTgt: avg(tgt.map(t => t.days)), dStp: avg(stp.map(t => t.days)),
    closed: done.length, open: T.filter(t => t.status === "OPEN").length,
    win: done.length ? Math.round(done.filter(t => (t.result_pct || 0) > 0).length / done.length * 100) : null,
    avg: avg(done.map(t => t.result_pct || 0)), moods, setups};
}

const STATUS = {
  "TARGET HIT": ["Sold at target", "p-win"], "EXIT 10EMA": ["Sold at target", "p-win"], "STOP HIT": ["Stop loss hit", "p-loss"], "OPEN": ["Holding", "p-open"],
  "WAITING": ["Waiting to buy", "p-idle"], "NOT TRIGGERED": ["Not bought", "p-idle"], "SKIPPED": ["Not bought", "p-idle"],
  "BREAKEVEN": ["Sold at buy price", "p-idle"], "DATA ISSUE": ["Check data", "p-idle"], [SOLD]: ["Sold on day " + MAXD, "p-idle"],
};
function when(t) {
  if (CLOSED.includes(t.status)) return `<b>${pct(t.result_pct)}</b><span class="sub">sold ${esc(day(t.exit_date))}, day ${t.days}</span>`;
  if (t.status === "OPEN") return `${pct(t.result_pct)} so far<span class="sub">day ${t.days}${t.sell_by ? ", sell by " + esc(day(t.sell_by)) : ""}</span>`;
  if (t.status === "WAITING" && t.sell_by) return `–<span class="sub">sell by ${esc(day(t.sell_by))} if bought</span>`;
  return "–";
}

function render() {
  const T = MODE === "all" ? ALL : ALL.filter(inReport), S = summary(T);
  $("b-report").setAttribute("aria-pressed", MODE !== "all");
  $("b-all").setAttribute("aria-pressed", MODE === "all");
  $("meta").textContent = ALL.length ? `Price now = NSE close on ${day(DATA.data_date)} · picks since ${day(DATA.first_pick)}` : "No picks tracked yet.";
  $("showing").textContent = MODE === "all" ? `${T.length} stocks: every day's ranked top 10` : `${T.length} stocks from the morning reports`;
  $("score").innerHTML =
    `<div class="tile win"><span class="k">Sold at target</span><span class="v">${S.target}</span>
       <span class="s">${S.dTgt == null ? "none yet" : "in " + days(+S.dTgt.toFixed(1)) + " on average"}</span></div>
     <div class="tile loss"><span class="k">Stop loss hit</span><span class="v">${S.stop}</span>
       <span class="s">${S.dStp == null ? "none yet" : "in " + days(+S.dStp.toFixed(1)) + " on average"}</span></div>
     <div class="tile"><span class="k">Win rate</span><span class="v">${S.win == null ? "–" : S.win + "%"}</span>
       <span class="s">of ${S.closed} closed trades · ${S.open} open</span></div>
     <div class="tile ${S.avg > 0 ? "win" : S.avg < 0 ? "loss" : ""}"><span class="k">Avg result</span>
       <span class="v">${S.avg == null ? "–" : pct(S.avg)}</span><span class="s">per closed trade, before charges</span></div>`;
  const SETUP_NAME = {DIP: "DIP setup (rules since 13 Nov)", PULLBACK: "PULLBACK setup (old rules)", BREAKOUT: "BREAKOUT setup (old rules)", READY: "READY setup (old rules)"};
  const rows = [...Object.entries(S.moods), ...Object.entries(S.setups).map(([k, g]) => [SETUP_NAME[k] || k, g])].map(([k, g]) => `<tr><td><b>${k}</b></td><td class="r num">${g.picks}</td>
    <td class="r num">${g.bought}</td><td class="r num">${g.closed}</td><td class="r num">${g.win == null ? "–" : g.win + "%"}</td>
    <td class="r num">${g.avg == null ? "–" : pct(g.avg)}</td></tr>`).join("");
  $("moods").innerHTML = rows ? `<thead><tr><th>Market when picked / setup</th><th class="r">Picks</th><th class="r">Bought</th>
    <th class="r">Closed</th><th class="r">Win rate</th><th class="r">Avg result</th></tr></thead><tbody>${rows}</tbody>`
    : `<tr><td class="empty">Scores by market mood appear once picks are tracked.</td></tr>`;
  if (!T.length) {
    $("ledger").innerHTML = `<tr><td class="empty">${ALL.length ? "No report picks to show yet. Switch to All top 10." : "Picks appear here the evening after the scanner suggests them."}</td></tr>`;
  } else {
    $("ledger").innerHTML = `<thead><tr><th>Stock</th><th>Picked on</th><th class="r">Buy at</th><th class="r">Sell at</th>
      <th class="r">Stop loss</th><th class="r">Price now</th><th>Status</th><th>Result</th></tr></thead><tbody>` +
      T.map(t => {
        const s = t.suggested || [], st = STATUS[t.status] || [t.status, "p-idle"];
        return `<tr>
          <td class="stock"><b>${esc(t.symbol)}</b>${MODE === "all" && inReport(t) ? '<span class="tag">report</span>' : ""}<span class="sub">${esc(t.company || "")}</span></td>
          <td>${esc(day(s[0]))}${s.length > 1 ? `<span class="x" title="Suggested ${s.length} days">×${s.length}</span>` : ""}</td>
          <td class="r num">${fmt(t.entry)}<span class="sub">${t.fill ? "bought at " + fmt(t.fill) : t.setup === "DIP" ? "limit order" : "buy-stop"}</span></td>
          <td class="r num">${(() => { const lvl = t.setup === "DIP" && t.status === "OPEN" && t.ema_now != null ? t.ema_now : t.t1, base = t.fill || t.entry;
            return `${fmt(lvl)}<span class="sub">${pct((lvl / base - 1) * 100)}${t.setup === "DIP" ? " · close above" : ""}</span>`; })()}</td>
          <td class="r num">${fmt(t.stop)}<span class="sub">${pct(((t.stop_now || t.stop) / (t.fill || t.entry) - 1) * 100)}</span></td>
          <td class="r num">${fmt(t.cmp)}${t.cmp == null || !t.fill ? "" : (() => { const b = t.status === "OPEN" ? t.cmp : t.exit_price; if (b == null) return ""; const c = (b / t.fill - 1) * 100;
            return `<span class="chg ${c > 0 ? "pos" : c < 0 ? "neg" : ""}" title="vs your buy price">${c > 0 ? "▲ " : c < 0 ? "▼ " : ""}${Math.abs(c).toFixed(1)}%</span>`; })()}</td>
          <td><span class="pill ${st[1]}">${st[0]}</span></td>
          <td class="hit">${when(t)}</td></tr>`;
      }).join("") + "</tbody>";
  }
}
const setMode = m => { MODE = m; try { localStorage.setItem("tracker-mode", m); } catch (e) {} render(); };
$("b-report").onclick = () => setMode("report");
$("b-all").onclick = () => setMode("all");
render();
fetch("reported.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(j => {
  if (j && j.days && typeof j.days === "object") { REP = j; render(); }
}).catch(() => {});

$("note").textContent = "Report picks = the stocks the 7:45 AM report gave you. All top 10 = every stock in each day's ranked shortlist. " +
  "Buy at = the limit buy price, good for the next trading day only (Not bought = the price never dipped to it). " +
  "Sell at = the stock's 10-day average: sell on the first day it closes above it (Sold at target). For a stock you hold it shows today's level, which moves a little each day; % is against your buy price. " +
  "Stop loss = sell if it falls to this price (% against your buy price). If neither happens, sell at the close of day " + MAXD + " (Sold on day " + MAXD + "). " +
  "Price now = the latest NSE close; the arrow % shows bought trades only, against your buy price. Older PULLBACK/BREAKOUT picks (before 13 Nov) used a buy-stop and Target 1. " +
  "Win rate = closed trades that made money. Results are before Zerodha charges (about 0.25% a trade).";
</script>

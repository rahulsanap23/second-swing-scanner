<title>Swing Pick Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root {

:root[data-theme="dark"] {

body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 48px; display: grid; gap: 26px; }
.wrap > * { min-width: 0; }
h1 { font-size: 32px; font-weight: 700; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 16px; }
.score { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 860px) { .score { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 4px; }
.tile .k { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tile .v { font-family: var(--mono); font-size: 38px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 15px; color: var(--muted); }
.tile.win .v { color: var(--win); } .tile.loss .v { color: var(--loss); }
@media (max-width: 520px) { .score { grid-template-columns: 1fr; } }
.tscroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 12px 7px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); white-space: normal; vertical-align: bottom; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td .sub { display: block; font-size: 14px; color: var(--muted); font-family: var(--sans); }
td b { font-family: var(--mono); font-weight: 600; }
td.stock { white-space: normal; min-width: 115px; max-width: 150px; }
td.hit { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.p-win { color: var(--win); background: var(--win-bg); } .p-loss { color: var(--loss); background: var(--loss-bg); }
.p-open { color: var(--open); background: var(--open-bg); } .p-idle { color: var(--idle); background: var(--idle-bg); }
.x { margin-left: 6px; font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.note { font-size: 15px; color: var(--muted); max-width: 80ch; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
td .chg { display: block; width: fit-content; margin: 4px 0 0 auto; padding: 1px 7px; border-radius: 5px;
  font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--muted); background: var(--idle-bg); }
td .chg.pos { color: var(--win); background: var(--win-bg); }
td .chg.neg { color: var(--loss); background: var(--loss-bg); }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.toggle button { font: inherit; font-size: 15px; padding: 8px 14px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--open-bg); color: var(--open); font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.tag { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--open); background: var(--open-bg); border-radius: 4px; padding: 1px 5px; }
</style>

<div class="wrap">

    <h1>Swing Pick Tracker</h1>

  </header>
  <div class="bar">

    <span class="meta" id="showing"></span>

  <div class="score" id="score"></div>
  <div class="tscroll"><table id="moods"></table></div>
  <div class="tscroll"><table id="ledger"></table></div>
  <p class="note" id="note"></p>
</div>

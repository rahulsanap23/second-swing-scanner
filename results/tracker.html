<style>

.tile.win .v { color: var(--win); } .tile.loss .v { color: var(--loss); } .tile.open .v { color: var(--open); }
.bar { height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; margin-top: 4px; }

.funnel { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.funnel span b { color: var(--fg); font-family: var(--mono); font-weight: 600; margin-right: 4px; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.split > section { min-width: 0; }

table { border-collapse: collapse; width: 100%; }

th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); font-family: var(--sans); }
td.stock { white-space: normal; min-width: 180px; max-width: 260px; }
td.stock b { font-family: var(--mono); font-weight: 600; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; }
.p-TARGET { color: var(--win); background: var(--win-bg); } .p-STOP { color: var(--loss); background: var(--loss-bg); }
.p-OPEN { color: var(--open); background: var(--open-bg); } .p-SKIPPED, .p-DATA { color: var(--warn); background: var(--warn-bg); }
.p-WAITING, .p-NOT, .p-EXPIRED { color: var(--idle); background: var(--idle-bg); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.x { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.flag { display: block; white-space: normal; font-size: 12px; color: var(--warn); max-width: 260px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

.chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules { font-size: 12.5px; color: var(--muted); max-width: 80ch; display: grid; gap: 4px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
</style>

</div>

function hitText(t) {
  if (t.status === "TARGET HIT" || t.status === "STOP HIT") return `day ${t.days}<span class="sub">${esc(day(t.exit_date))}</span>`;
  if (t.status === "EXPIRED") return `day ${t.days}<span class="sub">closed ${esc(day(t.exit_date))}</span>`;
  if (t.status === "OPEN") return `day ${t.days} so far`;
  return "–";
}
function resultText(t) {
  if (t.result_pct == null) return "–";
  const r = t.r_mult == null ? "" : `<span class="sub">${t.r_mult > 0 ? "+" : ""}${t.r_mult} R</span>`;
  return `<span class="${sign(t.result_pct)}">${pct(t.result_pct)}</span>${t.status === "OPEN" ? '<span class="sub">at last close</span>' : r}`;
}
function renderLedger() {
  $("chips").innerHTML = FILTERS.filter(([, s]) => s === null || T.some(t => t.status === s))
    .map(([k, s]) => `<button type="button" id="f-${(s || "all").replace(/ /g, "-")}" data-s="${s ?? ""}" aria-pressed="${s === active}">${k}${s ? " · " + T.filter(t => t.status === s).length : ""}</button>`).join("");
  const rows = T.filter(t => !active || t.status === active);
  if (!rows.length) { $("ledger").innerHTML = `<tr><td class="empty">${T.length ? "No picks with this status." : "Picks appear here the evening after the scanner suggests them."}</td></tr>`; return; }
  $("ledger").innerHTML = `<thead><tr><th>Stock</th><th>Setup</th><th>Suggested</th><th class="r">CMP at pick</th><th class="r">Buy above</th>
    <th class="r">Target 1</th><th class="r">Stop</th><th>Status</th><th>Bought</th><th>Hit on</th><th class="r">Result</th></tr></thead><tbody>` +
    rows.map(t => {
      const sug = t.suggested || [];
      const sugTxt = sug.length > 1 ? `${esc(day(sug[0]))} – ${esc(day(sug[sug.length - 1]))}` : esc(day(sug[0]));
      return `<tr>
        <td class="stock"><b>${esc(t.symbol)}</b><span class="sub">${esc(t.company || "name n/a")}</span>${t.flag ? `<span class="flag">${esc(t.flag)}</span>` : ""}</td>
        <td>${esc(t.setup)}</td>
        <td>${sugTxt}${sug.length > 1 ? `<span class="x" title="Suggested ${sug.length} times">×${sug.length}</span>` : ""}</td>
        <td class="r num">${fmt(t.close_at_pick)}</td>
        <td class="r num">${fmt(t.entry)}</td>
        <td class="r num">${fmt(t.t1)}<span class="sub pos">${pct(t.t1_pct)}</span></td>
        <td class="r num">${fmt(t.stop)}<span class="sub neg">${pct(t.stop_pct)}</span></td>
        <td><span class="pill ${pillClass(t.status)}">${esc(t.status)}</span></td>
        <td class="num">${t.entry_date ? `${esc(day(t.entry_date))}<span class="sub">at ${fmt(t.fill)}</span>` : "–"}</td>
        <td class="num">${hitText(t)}</td>
        <td class="r num">${resultText(t)}</td></tr>`;
    }).join("") + "</tbody>";
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  active = b.dataset.s || null;
  try { active ? localStorage.setItem("tracker-filter", active) : localStorage.removeItem("tracker-filter"); } catch (e) {}
  renderLedger();
});
renderLedger();

const R = DATA.rules || {};
$("rules").innerHTML = `<h2>How a pick is scored</h2>
  <div>Each pick's buy-stop counts for the next trading day only. If that day opens more than ${R.skip_gap_pct ?? 3}% above Buy above, it is skipped; otherwise it is bought when the high reaches Buy above (at the open if it gapped up).</div>
  <div>Day 1 is the day it was bought. A day whose low reaches the Stop is a stop hit; a day whose high reaches Target 1 is a target hit. If both happen the same day it counts as a stop hit. No hit within ${R.max_days ?? 20} trading days counts as expired at that day's close.</div>
  <div>A stock suggested again while its trade is open, or again the day after its buy-stop missed, stays one row; ×N shows how many days it was suggested. % values are from the Buy above price; Result is from the actual buy price. R = result ÷ the planned risk (buy price − Stop).</div>
  <div>Tracks the scanner's best 5 as saved each evening. Rules-based record, not investment advice.</div>`;
</script>

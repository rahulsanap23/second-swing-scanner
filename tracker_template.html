<title>Swing Pick Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ledger page. Scorecard first, then two small breakdowns, then the full pick-by-pick ledger. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #17202b; --muted: #5c6878; --line: #dde2ea; --accent: #1f5f8b;
  --win: #1a7f4b; --win-bg: #e3f4ea; --loss: #b4322d; --loss-bg: #fbe6e4; --warn: #9a6200; --warn-bg: #fdf1d8;
  --open: #1f5f8b; --open-bg: #e2eef7; --idle: #6b7584; --idle-bg: #eceff3;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --panel: #171e27; --fg: #e4e9ef; --muted: #95a1b1; --line: #2a3441; --accent: #6fb1e0;
  --win: #5fd394; --win-bg: #173527; --loss: #f2827b; --loss-bg: #3b1f1e; --warn: #f0bd5c; --warn-bg: #3a2d14;
  --open: #6fb1e0; --open-bg: #183048; --idle: #9aa5b3; --idle-bg: #232c38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #171e27; --fg: #e4e9ef; --muted: #95a1b1; --line: #2a3441; --accent: #6fb1e0;
  --win: #5fd394; --win-bg: #173527; --loss: #f2827b; --loss-bg: #3b1f1e; --warn: #f0bd5c; --warn-bg: #3a2d14;
  --open: #6fb1e0; --open-bg: #183048; --idle: #9aa5b3; --idle-bg: #232c38; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 28px; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 6px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.meta { color: var(--muted); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 600; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tile .v { font-family: var(--mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.tile.win .v { color: var(--win); } .tile.loss .v { color: var(--loss); } .tile.open .v { color: var(--open); }
.bar { height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--win); }
.funnel { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.funnel span b { color: var(--fg); font-family: var(--mono); font-weight: 600; margin-right: 4px; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.split > section { min-width: 0; }
.tscroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); font-family: var(--sans); }
td.stock { white-space: normal; min-width: 180px; max-width: 260px; }
td.stock b { font-family: var(--mono); font-weight: 600; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; }
.p-TARGET { color: var(--win); background: var(--win-bg); } .p-STOP { color: var(--loss); background: var(--loss-bg); }
.p-OPEN { color: var(--open); background: var(--open-bg); } .p-SKIPPED, .p-DATA { color: var(--warn); background: var(--warn-bg); }
.p-WAITING, .p-NOT, .p-EXPIRED { color: var(--idle); background: var(--idle-bg); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.x { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.flag { display: block; white-space: normal; font-size: 12px; color: var(--warn); max-width: 260px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chips button { font: 500 12.5px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rules { font-size: 12.5px; color: var(--muted); max-width: 80ch; display: grid; gap: 4px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>Swing Pick Tracker</h1>
    <div class="meta" id="meta"></div>
  </header>

  <section>
    <div class="score" id="score"></div>
  </section>

  <div class="funnel" id="funnel"></div>

  <div class="split">
    <section><h2>By days suggested in a row</h2><div class="tscroll"><table id="byTimes"></table></div></section>
    <section><h2>By setup</h2><div class="tscroll"><table id="bySetup"></table></div></section>
  </div>

  <section>
    <h2>Every pick</h2>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    <div class="tscroll"><table id="ledger"></table></div>
  </section>

  <section class="rules" id="rules"></section>
</div>

<script>
const DATA = /*__DATA__*/{};
const S = DATA.summary || {}, T = DATA.trades || [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d = 2) => n == null ? "–" : Number(n).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = n => n == null ? "–" : (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
const sign = n => n == null ? "" : n > 0 ? "pos" : n < 0 ? "neg" : "";
const day = s => { if (!s) return "–"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-IN", {day: "numeric", month: "short"}); };
const pillClass = s => "p-" + (s || "").split(" ")[0];

$("meta").innerHTML = T.length
  ? `Prices up to NSE close <b>${esc(day(DATA.data_date))}</b> · picks tracked from <b>${esc(day(DATA.first_pick))}</b> · updated ${esc((DATA.generated || "").slice(0, 16).replace("T", " "))} IST`
  : "No picks tracked yet.";

const decided = (S.target_hit || 0) + (S.stop_hit || 0);
$("score").innerHTML = [
  `<div class="tile"><span class="k">Win rate</span><span class="v">${S.win_rate == null ? "–" : S.win_rate + "%"}</span>
     <span class="s">target vs stop, ${decided} finished trade${decided === 1 ? "" : "s"}</span>
     <div class="bar" aria-hidden="true"><i style="width:${S.win_rate || 0}%"></i></div></div>`,
  `<div class="tile win"><span class="k">Target 1 hit</span><span class="v">${S.target_hit ?? 0}</span>
     <span class="s">${S.avg_days_to_target == null ? "no hits yet" : "avg " + S.avg_days_to_target + " trading day" + (S.avg_days_to_target === 1 ? "" : "s")}</span></div>`,
  `<div class="tile loss"><span class="k">Stop hit</span><span class="v">${S.stop_hit ?? 0}</span>
     <span class="s">${S.avg_days_to_stop == null ? "no hits yet" : "avg " + S.avg_days_to_stop + " trading day" + (S.avg_days_to_stop === 1 ? "" : "s")}</span></div>`,
  `<div class="tile open"><span class="k">Still open</span><span class="v">${S.open ?? 0}</span>
     <span class="s">bought, neither level hit yet</span></div>`,
  `<div class="tile"><span class="k">Avg result</span><span class="v ${sign(S.avg_result_pct)}">${pct(S.avg_result_pct)}</span>
     <span class="s">${S.avg_r == null ? "per finished trade" : "per finished trade · " + (S.avg_r > 0 ? "+" : "") + S.avg_r + " R"}</span></div>`,
].join("");

$("funnel").innerHTML = [
  ["stock ideas", S.stock_ideas], ["bought (triggered)", S.triggered], ["didn't trigger", S.not_triggered],
  ["skipped (gap-up)", S.skipped], ["waiting for today", S.waiting], ["expired (20 days)", S.expired], ["data issue", S.data_issue],
].filter(([, n]) => n).map(([k, n]) => `<span><b>${n}</b>${k}</span>`).join("");

function groupTable(el, groups, label, order) {
  const keys = Object.keys(groups || {}).sort((a, b) => (order ? order.indexOf(a) - order.indexOf(b) : a.localeCompare(b)));
  if (!keys.length) { $(el).innerHTML = `<tr><td class="empty">Nothing yet</td></tr>`; return; }
  $(el).innerHTML = `<thead><tr><th>${label}</th><th class="r">Ideas</th><th class="r">Bought</th><th class="r">Target</th><th class="r">Stop</th><th class="r">Open</th><th class="r">Win rate</th></tr></thead><tbody>` +
    keys.map(k => { const g = groups[k]; return `<tr><td>${esc(k)}</td><td class="r num">${g.picks}</td><td class="r num">${g.triggered}</td>
      <td class="r num pos">${g.target}</td><td class="r num neg">${g.stop}</td><td class="r num">${g.open}</td>
      <td class="r num">${g.win_rate == null ? "–" : g.win_rate + "%"}</td></tr>`; }).join("") + "</tbody>";
}
groupTable("byTimes", S.by_times_suggested, "Suggested", ["1 day", "2 days", "3+ days"]);
groupTable("bySetup", S.by_setup, "Setup", ["BREAKOUT", "READY", "PULLBACK"]);

const FILTERS = [["All", null], ["Target hit", "TARGET HIT"], ["Stop hit", "STOP HIT"], ["Open", "OPEN"], ["Waiting", "WAITING"],
  ["Didn't trigger", "NOT TRIGGERED"], ["Skipped", "SKIPPED"], ["Expired", "EXPIRED"], ["Data issue", "DATA ISSUE"]];
let active = null;
try { active = localStorage.getItem("tracker-filter") || null; } catch (e) {}
if (!FILTERS.some(([, s]) => s === active)) active = null;

function hitText(t) {
  if (t.status === "TARGET HIT" || t.status === "STOP HIT") return `day ${t.days}<span class="sub">${esc(day(t.exit_date))}</span>`;
  if (t.status === "EXPIRED") return `day ${t.days}<span class="sub">closed ${esc(day(t.exit_date))}</span>`;
  if (t.status === "OPEN") return `day ${t.days} so far`;
  return "–";
}
function resultText(t) {
  if (t.result_pct == null) return "–";
  const r = t.r_mult == null ? "" : `<span class="sub">${t.r_mult > 0 ? "+" : ""}${t.r_mult} R</span>`;
  return `<span class="${sign(t.result_pct)}">${pct(t.result_pct)}</span>${t.status === "OPEN" ? '<span class="sub">at last close</span>' : r}`;
}
function renderLedger() {
  $("chips").innerHTML = FILTERS.filter(([, s]) => s === null || T.some(t => t.status === s))
    .map(([k, s]) => `<button type="button" id="f-${(s || "all").replace(/ /g, "-")}" data-s="${s ?? ""}" aria-pressed="${s === active}">${k}${s ? " · " + T.filter(t => t.status === s).length : ""}</button>`).join("");
  const rows = T.filter(t => !active || t.status === active);
  if (!rows.length) { $("ledger").innerHTML = `<tr><td class="empty">${T.length ? "No picks with this status." : "Picks appear here the evening after the scanner suggests them."}</td></tr>`; return; }
  $("ledger").innerHTML = `<thead><tr><th>Stock</th><th>Setup</th><th>Suggested</th><th class="r">CMP at pick</th><th class="r">Buy above</th>
    <th class="r">Target 1</th><th class="r">Stop</th><th>Status</th><th>Bought</th><th>Hit on</th><th class="r">Result</th></tr></thead><tbody>` +
    rows.map(t => {
      const sug = t.suggested || [];
      const sugTxt = sug.length > 1 ? `${esc(day(sug[0]))} – ${esc(day(sug[sug.length - 1]))}` : esc(day(sug[0]));
      return `<tr>
        <td class="stock"><b>${esc(t.symbol)}</b><span class="sub">${esc(t.company || "name n/a")}</span>${t.flag ? `<span class="flag">${esc(t.flag)}</span>` : ""}</td>
        <td>${esc(t.setup)}</td>
        <td>${sugTxt}${sug.length > 1 ? `<span class="x" title="Suggested ${sug.length} times">×${sug.length}</span>` : ""}</td>
        <td class="r num">${fmt(t.close_at_pick)}</td>
        <td class="r num">${fmt(t.entry)}</td>
        <td class="r num">${fmt(t.t1)}<span class="sub pos">${pct(t.t1_pct)}</span></td>
        <td class="r num">${fmt(t.stop)}<span class="sub neg">${pct(t.stop_pct)}</span></td>
        <td><span class="pill ${pillClass(t.status)}">${esc(t.status)}</span></td>
        <td class="num">${t.entry_date ? `${esc(day(t.entry_date))}<span class="sub">at ${fmt(t.fill)}</span>` : "–"}</td>
        <td class="num">${hitText(t)}</td>
        <td class="r num">${resultText(t)}</td></tr>`;
    }).join("") + "</tbody>";
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  active = b.dataset.s || null;
  try { active ? localStorage.setItem("tracker-filter", active) : localStorage.removeItem("tracker-filter"); } catch (e) {}
  renderLedger();
});
renderLedger();

const R = DATA.rules || {};
$("rules").innerHTML = `<h2>How a pick is scored</h2>
  <div>Each pick's buy-stop counts for the next trading day only. If that day opens more than ${R.skip_gap_pct ?? 3}% above Buy above, it is skipped; otherwise it is bought when the high reaches Buy above (at the open if it gapped up).</div>
  <div>Day 1 is the day it was bought. A day whose low reaches the Stop is a stop hit; a day whose high reaches Target 1 is a target hit. If both happen the same day it counts as a stop hit. No hit within ${R.max_days ?? 20} trading days counts as expired at that day's close.</div>
  <div>A stock suggested again while its trade is open, or again the day after its buy-stop missed, stays one row; ×N shows how many days it was suggested. % values are from the Buy above price; Result is from the actual buy price. R = result ÷ the planned risk (buy price − Stop).</div>
  <div>Tracks the scanner's best 5 as saved each evening. Rules-based record, not investment advice.</div>`;
</script>

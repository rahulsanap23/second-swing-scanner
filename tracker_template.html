<title>Swing Pick Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one line of context, three numbers, one table. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #17202b; --muted: #5c6878; --line: #dde2ea; --accent: #1f5f8b;
  --win: #1a7f4b; --win-bg: #e3f4ea; --loss: #b4322d; --loss-bg: #fbe6e4;
  --open: #1f5f8b; --open-bg: #e2eef7; --idle: #6b7584; --idle-bg: #eceff3;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --panel: #171e27; --fg: #e4e9ef; --muted: #95a1b1; --line: #2a3441; --accent: #6fb1e0;
  --win: #5fd394; --win-bg: #173527; --loss: #f2827b; --loss-bg: #3b1f1e;
  --open: #6fb1e0; --open-bg: #183048; --idle: #9aa5b3; --idle-bg: #232c38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #171e27; --fg: #e4e9ef; --muted: #95a1b1; --line: #2a3441; --accent: #6fb1e0;
  --win: #5fd394; --win-bg: #173527; --loss: #f2827b; --loss-bg: #3b1f1e;
  --open: #6fb1e0; --open-bg: #183048; --idle: #9aa5b3; --idle-bg: #232c38; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tile .v { font-family: var(--mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.tile.win .v { color: var(--win); } .tile.loss .v { color: var(--loss); }
@media (max-width: 520px) { .score { grid-template-columns: 1fr; } }
.tscroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td .sub { display: block; font-size: 12px; color: var(--muted); font-family: var(--sans); }
td b { font-family: var(--mono); font-weight: 600; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.p-win { color: var(--win); background: var(--win-bg); } .p-loss { color: var(--loss); background: var(--loss-bg); }
.p-open { color: var(--open); background: var(--open-bg); } .p-idle { color: var(--idle); background: var(--idle-bg); }
.x { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.note { font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>Swing Pick Tracker</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="score" id="score"></div>
  <div class="tscroll"><table id="ledger"></table></div>
  <p class="note" id="note"></p>
</div>

<script>
const DATA = /*__DATA__*/{};
const S = DATA.summary || {}, T = DATA.trades || [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => n == null ? "" : (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
const day = s => s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", {day: "numeric", month: "short"}) : "–";
const days = n => n + " day" + (n === 1 ? "" : "s");

$("meta").textContent = T.length ? `Price now = NSE close on ${day(DATA.data_date)} · picks since ${day(DATA.first_pick)}` : "No picks tracked yet.";

$("score").innerHTML =
  `<div class="tile win"><span class="k">Target hit</span><span class="v">${S.target_hit ?? 0}</span>
     <span class="s">${S.avg_days_to_target == null ? "none yet" : "in " + days(S.avg_days_to_target) + " on average"}</span></div>
   <div class="tile loss"><span class="k">Stop hit</span><span class="v">${S.stop_hit ?? 0}</span>
     <span class="s">${S.avg_days_to_stop == null ? "none yet" : "in " + days(S.avg_days_to_stop) + " on average"}</span></div>
   <div class="tile"><span class="k">Win rate</span><span class="v">${S.win_rate == null ? "–" : S.win_rate + "%"}</span>
     <span class="s">${S.open ?? 0} still open</span></div>`;

const STATUS = {
  "TARGET HIT": ["Target hit", "p-win"], "STOP HIT": ["Stop hit", "p-loss"], "OPEN": ["Open", "p-open"],
  "WAITING": ["Waiting", "p-idle"], "NOT TRIGGERED": ["Not bought", "p-idle"], "SKIPPED": ["Not bought", "p-idle"],
  "EXPIRED": ["Expired", "p-idle"], "DATA ISSUE": ["Check data", "p-idle"],
};
function when(t) {
  if (t.status === "TARGET HIT" || t.status === "STOP HIT") return `day ${t.days}<span class="sub">${esc(day(t.exit_date))}</span>`;
  if (t.status === "OPEN") return `day ${t.days} so far`;
  if (t.status === "EXPIRED") return `${t.days} days<span class="sub">${pct(t.result_pct)}</span>`;
  return "–";
}
if (!T.length) {
  $("ledger").innerHTML = `<tr><td class="empty">Picks appear here the evening after the scanner suggests them.</td></tr>`;
} else {
  $("ledger").innerHTML = `<thead><tr><th>Stock</th><th>Suggested</th><th class="r">Buy above</th><th class="r">Target 1</th>
    <th class="r">Stop</th><th class="r">Price now</th><th>Status</th><th>Hit on</th></tr></thead><tbody>` +
    T.map(t => {
      const s = t.suggested || [], st = STATUS[t.status] || [t.status, "p-idle"];
      return `<tr>
        <td><b>${esc(t.symbol)}</b><span class="sub">${esc(t.company || "")}</span></td>
        <td>${esc(day(s[0]))}${s.length > 1 ? `<span class="x" title="Suggested ${s.length} days">×${s.length}</span>` : ""}</td>
        <td class="r num">${fmt(t.entry)}</td>
        <td class="r num">${fmt(t.t1)}<span class="sub">${pct(t.t1_pct)}</span></td>
        <td class="r num">${fmt(t.stop)}<span class="sub">${pct(t.stop_pct)}</span></td>
        <td class="r num">${fmt(t.cmp)}<span class="sub">${t.cmp == null ? "" : pct((t.cmp / t.entry - 1) * 100) + " vs buy"}</span></td>
        <td><span class="pill ${st[1]}">${st[0]}</span></td>
        <td class="num">${when(t)}</td></tr>`;
    }).join("") + "</tbody>";
}

$("note").textContent = "Day 1 is the day the stock was bought. Not bought = it didn't reach Buy above the next trading day. " +
  "×2, ×3 = suggested on that many days. Price now is the latest NSE close, updated every trading day. Win rate = target hits out of target + stop hits.";
</script>
